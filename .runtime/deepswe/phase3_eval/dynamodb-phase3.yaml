# Runtime-only Phase-3 frozen-memory evaluation for dynamodb-toolbox.
# Uses the controller-written pack under results/deepswe/phase3-memory/dynamodb-lazy-recursive-01.
# Mirrors dateutil-phase3.yaml except: task, frozen_memory_path, job_name,
# report_recovery_attempts (2 -> 5) and total_timeout_sec (10200 -> 14400).
jobs_dir: results/deepswe/jobs
job_name: bitfun-dynamodb-rsi-phase3
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1
# task.toml declares [agent] timeout_sec = 10800, and the preflight requires
# total_timeout_sec < 10800 * timeout_multiplier * agent_timeout_multiplier.
# 1.5 raises that ceiling to 16200 so the 14400s work budget fits.
# DEVIATION from the source protocol, which used agent_timeout_multiplier: 1.
agent_timeout_multiplier: 1.5
verifier_timeout_multiplier: 1
environment_build_timeout_multiplier: 1
retry:
  max_retries: 0
environment:
  type: docker
  import_path: benchmarks.deepswe.docker_environment:BitfunDockerEnvironment
  kwargs:
    inference_ports: [8080]
  force_build: false
  delete: true
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
  mounts:
    - type: bind
      source: .runtime/deepswe/bin/uv
      target: /usr/local/bin/uv
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .runtime/deepswe/bin/bitfun
      target: /usr/local/bin/bitfun
      read_only: true
      bind:
        create_host_path: false
agents:
  - name: bitfun-phase3-frozen
    import_path: phase3_eval.frozen_phase3_agent:FrozenMemoryPhase3
    model_name: DeepSeek-V4.1-Flash-1017
    kwargs:
      binary_path: /usr/local/bin/bitfun
      output_patch_path: null
      frozen_memory_path: /data/k8s/yx/RSIAgent4Coding/results/deepswe/phase3-memory/dynamodb-lazy-recursive-01/memory_frozen
      total_timeout_sec: 14400
      report_recovery_attempts: 5
      command_timeout_sec: 600
      stall_recovery: true
      allow_role_swap: true
      bitfun_config: &common_bitfun
        app:
          logging:
            model_exchange_tracing:
              mode: full
        ai:
          models:
            - &actor_model
              id: DeepSeek-V4.1-Flash-1017
              name: DeepSeek-V4.1-Flash-1017
              provider: openai
              model_name: DeepSeek-V4.1-Flash-1017
              base_url: http://113.46.219.251:8080/v1
              api_key: ${API_KEY}
              enabled: true
              context_window: 1048576
              max_tokens: 65536
              reasoning_mode: enabled
              reasoning_effort: max
          default_models:
            primary: DeepSeek-V4.1-Flash-1017
            fast: DeepSeek-V4.1-Flash-1017
      verifier_bitfun_config:
        <<: *common_bitfun
        ai:
          models:
            - <<: *actor_model
              id: Qwen3.8-Flash
              name: Qwen3.8-Flash
              model_name: Qwen3.8-Flash
          default_models:
            primary: Qwen3.8-Flash
            fast: Qwen3.8-Flash
datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - dynamodb-toolbox-lazy-recursive-schemas
