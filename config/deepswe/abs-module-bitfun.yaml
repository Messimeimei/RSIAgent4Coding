# 路径相对于 RSIAgent4Coding，被 run_deepswe.py 读取解析
jobs_dir: results/deepswe/jobs
job_name: bitfun-abs-module # 记录这次实验的名字
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1
agent_timeout_multiplier: 1
verifier_timeout_multiplier: 1
environment_build_timeout_multiplier: 1
retry:
  max_retries: 0
environment:
  type: docker
  import_path: benchmarks.deepswe.docker_environment:BitfunDockerEnvironment
  kwargs:
    inference_ports: [8080] # 对应下面的 base_url: 里面的 8080 端口，表示允许访问模型的特殊端口。
  force_build: false
  delete: true
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
  mounts:
    - type: bind
      source: .runtime/deepswe/bin/uv
      target: /usr/local/bin/uv
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .runtime/deepswe/bin/bitfun
      target: /usr/local/bin/bitfun
      read_only: true
      bind:
        create_host_path: false
agents:
  - name: bitfun-cli
    import_path: benchmarks.deepswe.bitfun_agent:BitfunCli
    model_name: DeepSeek-V4.1-Flash-1017 # 记录实验用的模型，不影响实际使用的
    kwargs:
      binary_path: /usr/local/bin/bitfun
      output_patch_path: null
      bitfun_config:
        app:
          logging:
            model_exchange_tracing:
              mode: full
        ai:
          models:
            - id: DeepSeek-V4.1-Flash-1017
              name: DeepSeek-V4.1-Flash-1017
              provider: openai
              model_name: DeepSeek-V4.1-Flash-1017 # 实际使用模型，应与上面的 model_name 一致
              base_url: http://113.46.219.251:8080/v1 # 8080
              api_key: ${API_KEY}
              enabled: true
              context_window: 1048576
              max_tokens: 65536
              reasoning_mode: enabled
              reasoning_effort: max
          default_models:
            primary: DeepSeek-V4.1-Flash-1017
            fast: DeepSeek-V4.1-Flash-1017
datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - abs-module-cache-flags # 真正要执行的任务
