# Full RSI, independent of native and baseline jobs.
jobs_dir: results/deepswe/jobs
job_name: bitfun-dateutil-rsi
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1
agent_timeout_multiplier: 1
verifier_timeout_multiplier: 1
environment_build_timeout_multiplier: 1
retry:
  max_retries: 0
environment:
  type: docker
  import_path: benchmarks.deepswe.docker_environment:BitfunDockerEnvironment
  kwargs:
    inference_ports: [8080]
  force_build: false
  delete: true
  cpu_enforcement_policy: limit
  memory_enforcement_policy: limit
  mounts:
    - type: bind
      source: .runtime/deepswe/bin/uv
      target: /usr/local/bin/uv
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: .runtime/deepswe/bin/bitfun
      target: /usr/local/bin/bitfun
      read_only: true
      bind:
        create_host_path: false
agents:
  - name: bitfun-rsi
    import_path: benchmarks.deepswe.rsi:BitfunRSI
    model_name: DeepSeek-V4.1-Flash-1017
    kwargs:
      binary_path: /usr/local/bin/bitfun
      output_patch_path: null
      # Phase 3 keeps the existing baseline work budget. The RSI-only Pier
      # adapter applies per-role/per-attempt clocks, with no global DRS cap.
      total_timeout_sec: 10200
      learning_timeout_sec: 86400
      target_learning_timeout_sec: 36000
      brs_project_budget: 8
      parallel: 2
      report_recovery_attempts: 2
      # In-place archive repair; no model replay and no charge to role work clock.
      checkpoint_repair_timeout_sec: 3600
      command_timeout_sec: 600
      stall_recovery: true
      allow_role_swap: true
      bitfun_config: &common_bitfun
        app:
          logging:
            model_exchange_tracing:
              mode: full
        ai:
          models:
            - &actor_model
              id: DeepSeek-V4.1-Flash-1017
              name: DeepSeek-V4.1-Flash-1017
              provider: openai
              model_name: DeepSeek-V4.1-Flash-1017
              base_url: http://113.46.219.251:8080/v1
              api_key: ${API_KEY}
              enabled: true
              context_window: 1048576
              max_tokens: 65536
              reasoning_mode: enabled
              reasoning_effort: max
          default_models:
            primary: DeepSeek-V4.1-Flash-1017
            fast: DeepSeek-V4.1-Flash-1017
      verifier_bitfun_config: &review_model
        <<: *common_bitfun
        ai:
          models:
            - <<: *actor_model
              id: Qwen3.8-Flash
              name: Qwen3.8-Flash
              model_name: Qwen3.8-Flash
          default_models:
            primary: Qwen3.8-Flash
            fast: Qwen3.8-Flash
      curriculum_bitfun_config: *review_model
datasets:
  - path: ../DeepSWE/tasks
    task_names:
      - dateutil-rfc5545-timezone-interop
